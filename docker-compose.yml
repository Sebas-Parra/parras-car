services:
  users-db:
    image: postgres:16-alpine
    container_name: parras-users-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME_USERS}
    ports:
      - '${DB_PORT_USERS}:5432'
    volumes:
      - users_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME_USERS}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - parras_network

  vehicles-db:
    image: postgres:16-alpine
    container_name: parras-vehicles-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME_VEHICLES}
    ports:
      - '${DB_PORT_VEHICLES}:5432'
    volumes:
      - vehicles_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME_VEHICLES}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - parras_network

  zones-db:
    image: postgres:16-alpine
    container_name: parras-zones-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME_ZONES}
    ports:
      - '${DB_PORT_ZONES}:5432'
    volumes:
      - zones_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME_ZONES}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - parras_network

  assignments-db:
    image: postgres:16-alpine
    container_name: parras-assignments-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME_ASSIGNMENTS}
    ports:
      - '${DB_PORT_ASSIGNMENTS}:5432'
    volumes:
      - assignments_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME_ASSIGNMENTS}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - parras_network

  tickets-db:
    image: postgres:16-alpine
    container_name: parras-tickets-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME_TICKETS}
    ports:
      - '${DB_PORT_TICKETS}:5432'
    volumes:
      - tickets_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME_TICKETS}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - parras_network

  audit-db:
    image: postgres:16-alpine
    container_name: parras-audit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME_AUDIT}
    ports:
      - '${DB_PORT_AUDIT}:5432'
    volumes:
      - audit_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME_AUDIT}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - parras_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: parras-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - parras_network

  # ─── Microservices ────────────────────────────────────────────

  users:
    build:
      context: ./users
      dockerfile: Dockerfile
    container_name: parras-users
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@users-db:5432/${DB_NAME_USERS}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY}
    ports:
      - '8000:8000'
    depends_on:
      users-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - parras_network
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  vehicles:
    build:
      context: ./vehicles
      dockerfile: Dockerfile
    container_name: parras-vehicles
    restart: unless-stopped
    environment:
      DB_HOST: vehicles-db
      DB_PORT: 5432
      DB_USUARIO: ${DB_USER}
      DB_CONTRASENA: ${DB_PASSWORD}
      DB_NOMBRE: ${DB_NAME_VEHICLES}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY}
    ports:
      - '3000:3000'
    depends_on:
      vehicles-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - parras_network

  zones:
    build:
      context: ./zones
      dockerfile: Dockerfile
    container_name: parras-zones
    restart: unless-stopped
    environment:
      DB_HOST: zones-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME_ZONES}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY}
    ports:
      - '8080:8080'
    depends_on:
      zones-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - parras_network

  assignments:
    build:
      context: ./assignments
      dockerfile: Dockerfile
    container_name: parras-assignments
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@assignments-db:5432/${DB_NAME_ASSIGNMENTS}
      VEHICLES_SERVICE_URL: ${VEHICLES_SERVICE_URL}
      USERS_SERVICE_URL: ${USERS_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - '8001:8001'
    depends_on:
      assignments-db:
        condition: service_healthy
      users:
        condition: service_started
      vehicles:
        condition: service_started
    networks:
      - parras_network
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001"

  tickets:
    build:
      context: ./tickets
      dockerfile: Dockerfile
    container_name: parras-tickets
    restart: unless-stopped
    environment:
      DB_HOST: tickets-db
      DB_PORT: 5432
      DB_USUARIO: ${DB_USER}
      DB_CONTRASENA: ${DB_PASSWORD}
      DB_NOMBRE: ${DB_NAME_TICKETS}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY}
      ZONES_SERVICE_URL: ${ZONES_SERVICE_URL}
      VEHICLES_SERVICE_URL: ${VEHICLES_SERVICE_URL}
      ASSIGNMENTS_SERVICE_URL: ${ASSIGNMENTS_SERVICE_URL}
      TICKET_PRICE: ${TICKET_PRICE}
      PLACE_RATE_CAR: ${PLACE_RATE_CAR}
      PLACE_RATE_BIKE: ${PLACE_RATE_BIKE}
      PLACE_RATE_BUS: ${PLACE_RATE_BUS}
      ZONE_MULT_REGULAR: ${ZONE_MULT_REGULAR}
      ZONE_MULT_VIP: ${ZONE_MULT_VIP}
      ZONE_MULT_INTERNAL: ${ZONE_MULT_INTERNAL}
      ZONE_MULT_EXTERNAL: ${ZONE_MULT_EXTERNAL}
      ZONE_MULT_PREFERENTIAL: ${ZONE_MULT_PREFERENTIAL}
    ports:
      - '3001:3000'
    depends_on:
      tickets-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zones:
        condition: service_started
      vehicles:
        condition: service_started
      assignments:
        condition: service_started
    networks:
      - parras_network

  ms-audit:
    build:
      context: ./ms-audit
      dockerfile: Dockerfile
    container_name: parras-ms-audit
    restart: unless-stopped
    environment:
      DB_HOST: audit-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME_AUDIT}
      PORT: 3002
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY}
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 10
    ports:
      - '3002:3002'
    depends_on:
      audit-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - parras_network

  # ─── API Gateway ──────────────────────────────────────────────

  kong:
    image: kong:3.9
    container_name: parras-gateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: '0.0.0.0:8001'
    ports:
      - '9000:8000'
      - '9001:8001'
    volumes:
      - ./gateway:/kong/declarative
    depends_on:
      - users
      - vehicles
      - zones
      - assignments
      - tickets
    networks:
      - parras_network

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: parras-swagger-ui
    restart: unless-stopped
    environment:
      BASE_URL: /docs
      URLS: >-
        [{"url":"/users/openapi.json","name":"Users"},{"url":"/vehicles/api-json","name":"Vehicles"},{"url":"/zones/v3/api-docs","name":"Zones"},{"url":"/assignments/openapi.json","name":"Assignments"},{"url":"/tickets/api-json","name":"Tickets"}]
    depends_on:
      - kong
    networks:
      - parras_network

volumes:
  users_db_data:
  vehicles_db_data:
  zones_db_data:
  assignments_db_data:
  tickets_db_data:
  audit_db_data:

networks:
  parras_network:
    driver: bridge
