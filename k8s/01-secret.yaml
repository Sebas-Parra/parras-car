# Valores de desarrollo local, tomados de .env.example.
# Para un entorno real, generar este Secret desde un manager externo
# (kubectl create secret / sealed-secrets / vault) en vez de versionarlo.
apiVersion: v1
kind: Secret
metadata:
  name: parras-secrets
  namespace: parras-car
type: Opaque
stringData:
  DB_USER: postgres
  DB_PASSWORD: postgres
  JWT_SECRET: cambia_esto_por_un_secreto_seguro
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest
