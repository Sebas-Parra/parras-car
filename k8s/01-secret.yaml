# Valores de desarrollo local. Para un entorno real, generar este Secret
# desde un manager externo (kubectl create secret / sealed-secrets / vault)
# en vez de versionarlo.
#
# JWT_SECRET debe coincidir EXACTAMENTE con el secreto del consumer JWT
# en gateway/kong.yml (consumers[0].jwt_secrets[0].secret) — Kong valida
# la firma de los tokens usando ese valor + el claim "iss" (= "parras-app-key",
# ver users/app/core/config.py), no un secreto propio de Kong.
apiVersion: v1
kind: Secret
metadata:
  name: parras-secrets
  namespace: parras-car
type: Opaque
stringData:
  DB_USER: postgres
  DB_PASSWORD: postgres
  JWT_SECRET: 6f2f368a76edefcc1859716acadb5cd68ac14bd4186334c03ba341da97dff77c
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest
