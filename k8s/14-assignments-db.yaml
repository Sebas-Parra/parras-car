apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: assignments-db-pvc
  namespace: parras-car
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assignments-db
  namespace: parras-car
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: assignments-db
  template:
    metadata:
      labels:
        app: assignments-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: parras-secrets, key: DB_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: parras-secrets, key: DB_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: parras-config, key: DB_NAME_ASSIGNMENTS }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: assignments-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: assignments-db
  namespace: parras-car
spec:
  selector:
    app: assignments-db
  ports:
    - port: 5432
      targetPort: 5432
