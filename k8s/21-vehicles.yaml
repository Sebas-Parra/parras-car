apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicles
  namespace: parras-car
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vehicles
  template:
    metadata:
      labels:
        app: vehicles
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z vehicles-db 5432; do echo "esperando vehicles-db..."; sleep 2; done
              until nc -z rabbitmq 5672; do echo "esperando rabbitmq..."; sleep 2; done
      containers:
        - name: vehicles
          image: parras-car-vehicles:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: vehicles-db
            - name: DB_PORT
              value: "5432"
            - name: DB_USUARIO
              valueFrom: { secretKeyRef: { name: parras-secrets, key: DB_USER } }
            - name: DB_CONTRASENA
              valueFrom: { secretKeyRef: { name: parras-secrets, key: DB_PASSWORD } }
            - name: DB_NOMBRE
              valueFrom: { configMapKeyRef: { name: parras-config, key: DB_NAME_VEHICLES } }
            - name: PORT
              value: "3000"
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: parras-secrets, key: JWT_SECRET } }
            - name: RABBITMQ_HOST
              valueFrom: { configMapKeyRef: { name: parras-config, key: RABBITMQ_HOST } }
            - name: RABBITMQ_PORT
              valueFrom: { configMapKeyRef: { name: parras-config, key: RABBITMQ_PORT } }
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: parras-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: parras-secrets, key: RABBITMQ_PASSWORD } }
            - name: RABBITMQ_EXCHANGE
              valueFrom: { configMapKeyRef: { name: parras-config, key: RABBITMQ_EXCHANGE } }
            - name: RABBITMQ_ROUTING_KEY
              valueFrom: { configMapKeyRef: { name: parras-config, key: RABBITMQ_ROUTING_KEY } }
---
apiVersion: v1
kind: Service
metadata:
  name: vehicles
  namespace: parras-car
spec:
  selector:
    app: vehicles
  ports:
    - port: 3000
      targetPort: 3000
