apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-audit
  namespace: parras-car
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-audit
  template:
    metadata:
      labels:
        app: ms-audit
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z audit-db 5432; do echo "esperando audit-db..."; sleep 2; done
              until nc -z rabbitmq 5672; do echo "esperando rabbitmq..."; sleep 2; done
      containers:
        - name: ms-audit
          image: parras-car-ms-audit:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - name: DB_HOST
              value: audit-db
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: parras-secrets, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: parras-secrets, key: DB_PASSWORD } }
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: parras-config, key: DB_NAME_AUDIT } }
            - name: PORT
              value: "3002"
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: parras-secrets, key: JWT_SECRET } }
            - name: RABBITMQ_HOST
              valueFrom: { configMapKeyRef: { name: parras-config, key: RABBITMQ_HOST } }
            - name: RABBITMQ_PORT
              valueFrom: { configMapKeyRef: { name: parras-config, key: RABBITMQ_PORT } }
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: parras-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: parras-secrets, key: RABBITMQ_PASSWORD } }
            - name: RABBITMQ_QUEUE
              valueFrom: { configMapKeyRef: { name: parras-config, key: RABBITMQ_QUEUE } }
            - name: RABBITMQ_EXCHANGE
              valueFrom: { configMapKeyRef: { name: parras-config, key: RABBITMQ_EXCHANGE } }
            - name: RABBITMQ_ROUTING_KEY
              valueFrom: { configMapKeyRef: { name: parras-config, key: RABBITMQ_ROUTING_KEY } }
            - name: THROTTLE_TTL
              value: "60"
            - name: THROTTLE_LIMIT
              value: "10"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-audit
  namespace: parras-car
spec:
  selector:
    app: ms-audit
  ports:
    - port: 3002
      targetPort: 3002
