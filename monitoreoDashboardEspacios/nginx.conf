server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cuando el dashboard se expone por NodePort/port-forward, las llamadas
    # relativas /api/... deben ir a Kong dentro del cluster.
    location /api/ {
        proxy_pass http://kong:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # SPA: cualquier ruta que no sea un archivo estático cae a index.html
    # para que React Router maneje la navegación del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
