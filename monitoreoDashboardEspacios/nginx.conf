server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo estático cae a index.html
    # para que React Router maneje la navegación del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
